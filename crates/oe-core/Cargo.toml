[package]
name = "oe-core"
description = "The app itself, without a window: settings, the account, setup, updates and the device, behind the API the UI drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
oe-engine = { workspace = true }
oe-formats = { workspace = true }
oe-store = { workspace = true }
oe-win = { workspace = true }
aes-gcm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
oe-engine = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
