[package]
name = "oe-ui"
description = "open-emulator's window: the shell, the device, apps, the store, settings and setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "open-emulator"
path = "src/main.rs"

[dependencies]
iced = { workspace = true }
oe-core = { workspace = true }
oe-engine = { workspace = true }
oe-store = { workspace = true }
oe-win = { workspace = true }
raw-window-handle = { workspace = true }
rfd = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }

# The icon and version details Explorer shows for open-emulator.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
