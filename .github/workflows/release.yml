name: Release

# Builds the Windows installer on Windows, after the test suite passes.
#
#   - Pushing a version tag (v0.3.0) also publishes it as a GitHub release: the installer and
#     latest.yml. That release is where installed copies look for updates — this app's updater and
#     the Electron version's alike read latest.yml from the latest release.
#   - Running it by hand (Actions → Release → Run workflow) builds without publishing, and keeps
#     the installer as a workflow artifact for a week.
#
# The tag has to match the workspace version in Cargo.toml. An installed copy compares its own
# version with latest.yml's, so a release built from an un-bumped Cargo.toml would never be offered.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "oe-ui") | .version')"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version ($expected)"
            exit 1
          fi

      - run: cargo test --workspace

      # The runner images have carried NSIS; install it if this one does not.
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - run: cargo xtask dist

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/dist/open-emulator-Setup-*.exe \
            target/dist/latest.yml \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: open-emulator-windows
          path: |
            target/dist/*.exe
            target/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
