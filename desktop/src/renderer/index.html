<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      No remote origin is reachable from this window. App-store icons and screenshots arrive over
      oe-app:, which the main process serves from its own on-disk cache after fetching and sniffing
      them; blob: is the mirrored Android frames. connect-src 'none' is the load-bearing one:
      everything this window needs, it asks the main process for over IPC, so it never issues a
      network request of its own and cannot be tracked or fingerprinted by an app repository.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: oe-app:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>open-emulator</title>
    <style>
      /* ── Scales ──────────────────────────────────────────────────────────────────────────────
         Type, space, radius, elevation, and motion live here. Colour is themed below; these
         stay constant so a control sized at --text-sm / --space-3 is the same in both themes. */
      :root {
        --font-sans: "Segoe UI", system-ui, sans-serif;
        --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;

        --text-2xs: 0.6875rem;
        --text-xs: 0.75rem;
        --text-sm: 0.8125rem;
        --text-md: 0.875rem;
        --text-lg: 1rem;
        --text-xl: 1.125rem;
        --text-2xl: 1.25rem;
        --text-3xl: 1.5rem;

        --leading-none: 1;
        --leading-tight: 1.25;
        --leading-snug: 1.4;
        --leading-normal: 1.5;
        --leading-relaxed: 1.65;

        --tracking-tight: -0.02em;
        --tracking-normal: 0;
        --tracking-wide: 0.04em;
        --tracking-wider: 0.08em;

        --weight-regular: 400;
        --weight-semibold: 600;

        --space-0-5: 2px;
        --space-1: 4px;
        --space-1-5: 6px;
        --space-2: 8px;
        --space-2-5: 10px;
        --space-3: 12px;
        --space-3-5: 14px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-7: 28px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --titlebar-height: 44px;
        --bezel-width: 44px;
        --bezel-btn-size: 36px;

        --radius-xs: 4px;
        --radius-sm: 6px;
        --radius: 8px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --radius-xl: 16px;
        --radius-full: 999px;

        --z-menu-backdrop: 10;
        --z-menu: 11;
        --z-modal: 30;

        --duration-instant: 80ms;
        --duration-fast: 150ms;
        --duration-normal: 220ms;
        --duration-slow: 360ms;
        --duration-pulse: 1.5s;
        --duration-spin: 0.75s;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --ease-emphasized: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
        --ease-linear: linear;
        --ease: var(--duration-fast) var(--ease-standard);

        --scrollbar-size: 10px;

        /* Dark is the default: ink, paper and one mint. The neutrals carry no hue of their
           own, so the mint is the only colour on screen until something goes wrong. */
        --bg: #0b0b0c;
        --bg-deep: #050506;
        --chrome: #101011;
        --nav-track: #08080a;
        --surface: #161618;
        --surface-hover: #1e1e21;

        --border: #62636a;
        --border-strong: #8e8f96;
        --border-subtle: #2b2b30;

        --accent: #8ff2cc;
        --accent-strong: #03140d;
        --accent-hover: #b9f8e1;
        --accent-fill: #8ff2cc;
        --accent-fill-hover: #a9f6d9;
        --accent-fill-active: #74e0b6;
        --accent-border: #5fcfa5;
        --accent-glow: rgba(143, 242, 204, 0.2);
        --accent-soft: rgba(143, 242, 204, 0.11);
        --ok: #8ff2cc;
        --ok-fill: #2f9f77;
        --ok-bg: #10241c;

        --warn: #e9bd4a;

        --warn-ring: rgba(233, 189, 74, 0.22);
        --danger: #f29a9a;
        --danger-fill: #8a3e3e;

      * { box-sizing: border-box; }

      html {
        height: 100%;
        font-size: 100%;
        color-scheme: dark;
      }

      html, body { height: 100%; }

      body {
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-size: var(--text-md);
        font-weight: var(--weight-regular);
        line-height: var(--leading-normal);
      }

      button, input, select { font: inherit; color: inherit; }
      button { letter-spacing: inherit; }
      ::placeholder { color: var(--faint); }

      :focus { outline: none; }
      :focus-visible { box-shadow: var(--focus); }

      @keyframes panel-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }

      ::selection { background: var(--selection-bg); color: var(--selection-fg); }

      ::-webkit-scrollbar { width: var(--scrollbar-size); height: var(--scrollbar-size); }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: var(--radius);
        border: var(--space-0-5) solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); background-clip: padding-box; }

      #root { height: 100vh; display: flex; }

      #oe-icon-sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .oe-icon {
        display: inline-block;
        flex: none;
        vertical-align: -0.125em;
      }

      .oe-icon-loader {
        transform-box: fill-box;
        transform-origin: center;
        animation: oe-spin var(--duration-spin) var(--ease-linear) infinite;
      }

      @keyframes oe-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* ── First run ───────────────────────────────────────────────────────────────────────────
         Same language as the device idle screen: a mark, a sentence, a bar. The long wait adds
         elapsed time and a step track so tens of minutes stay legible. The two-second launch
         stays a splash — no card, no percent reel, no reserved empty copy. The log still lives
         behind Details. */
      .setup {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-10) var(--space-7);
        overflow-y: auto;
        /* Ink lit from above: a pale wash at the top edge falling off into the page, and the page
           falling off into its deepest tone at the bottom. The one colour is in ::before. */
        background:
          radial-gradient(ellipse 85% 60% at 50% -18%, var(--wash-top), var(--wash-edge) 62%),
          linear-gradient(180deg, var(--bg) 40%, var(--bg-deep) 100%);
        isolation: isolate;
      }
      .setup::before {
        content: "";
        position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background: radial-gradient(ellipse 46% 34% at 50% 0%, var(--setup-wash), transparent 70%);
        animation: wash-breathe 7s var(--ease-in-out) infinite;
      }
      /* A failure is not something to breathe at. */
      .setup.is-failed::before { animation: none; opacity: 0.3; }
      @keyframes wash-breathe {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      .setup-frame {
        width: 100%;
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        animation: panel-in var(--duration-slow) var(--ease-emphasized);
      }
      .setup.is-compact .setup-frame {
        max-width: 22rem;
        align-items: center;
        text-align: center;
      }
      .setup.is-held .setup-frame { max-width: 28rem; }
      /* Beside a headline the mark is a signature, not the subject. */
      .setup.is-held .brand-mark-lg { width: 44px; height: 44px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--brand-edge), inset 0 1px 0 var(--brand-sheen); }
      .setup.is-held .brand-mark-lg .brand-dot { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; }

      .setup-brand { display: flex; align-items: center; gap: var(--space-3-5); margin-bottom: var(--space-7); }
      .setup.is-compact .setup-brand {
        flex-direction: column;
        gap: var(--space-5);
        margin-bottom: var(--space-8);
      }
      .setup-brand h1 {
        font-size: var(--text-2xl); line-height: var(--leading-tight); margin: 0;
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight);
        /* The wordmark is the page's gradient in miniature: full ink at the top, softer below. */
        color: var(--text);
        background: linear-gradient(180deg, var(--text) 30%, var(--muted) 130%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .setup.is-compact .setup-brand h1 { font-size: var(--text-3xl); }
      .setup-tagline {
        margin: var(--space-1-5) 0 0; font-size: var(--text-2xs); line-height: var(--leading-snug);
        color: var(--faint); letter-spacing: var(--tracking-wider); text-transform: uppercase;
        font-weight: var(--weight-semibold);
      }

      /* ── The mark ────────────────────────────────────────────────────────────────────────────
         An ink tile in both themes, a phone drawn in one stroke, and a mint dot: the only colour
         the brand owns. While something is being waited for, the dot breathes. */
      .brand-mark {
        position: relative; flex: none;
        display: grid; place-items: center;
        background: linear-gradient(155deg, var(--brand-from) 0%, var(--brand-mid) 52%, var(--brand-to) 100%);
        color: var(--brand-fg);
        box-shadow: inset 0 0 0 1px var(--brand-edge), inset 0 1px 0 var(--brand-sheen);
      }
      .brand-mark svg { display: block; width: 62%; height: 62%; }
      .brand-mark-sm { width: 22px; height: 22px; border-radius: var(--radius-sm); }
      .brand-mark-lg {
        width: 68px; height: 68px; border-radius: 18px;
        box-shadow:
          inset 0 0 0 1px var(--brand-edge), inset 0 1px 0 var(--brand-sheen),
          0 18px 44px rgba(0, 0, 0, 0.38);
      }
      .brand-dot {
        position: absolute; left: 50%; top: 50%;
        width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: var(--radius-full);
        background: var(--mint);
        box-shadow: 0 0 0 3px rgba(143, 242, 204, 0.14), 0 0 12px rgba(143, 242, 204, 0.5);
      }
      .brand-mark-lg .brand-dot {
        width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
        box-shadow: 0 0 0 5px rgba(143, 242, 204, 0.12), 0 0 22px rgba(143, 242, 204, 0.6);
      }
      .brand-mark.is-live .brand-dot { animation: dot-breathe 1.8s var(--ease-in-out) infinite; }
      @keyframes dot-breathe {
        0%, 100% { transform: scale(0.78); opacity: 0.7; }
        50% { transform: scale(1.14); opacity: 1; }
      }

      /* ── The bar ─────────────────────────────────────────────────────────────────────────────
         A hairline. What is known fills from ink to mint; what is not known is a short run of
         the same gradient crossing the whole track, over whatever fill is already there. */
      .setup-bar {
        position: relative;
        height: 3px; border-radius: var(--radius-full);
        background: var(--hairline);
        overflow: hidden;
      }
      .setup.is-compact .setup-bar { width: 200px; }
      .setup-bar-fill {
        display: block; height: 100%;
        background: linear-gradient(90deg, var(--progress-from), var(--progress-to));
        border-radius: var(--radius-full);
        transition: width var(--duration-slow) var(--ease-standard);
      }
      .setup-bar-failed { background: linear-gradient(90deg, var(--progress-fail-from), var(--progress-fail-to)); }
      .setup-bar-pulsing::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, var(--progress-from) 45%, var(--progress-to) 72%, transparent);
        background-size: 42% 100%; background-repeat: no-repeat;
        animation: bar-sweep 1.5s var(--ease-in-out) infinite;
      }
      /* A 42%-wide run is fully off the left edge at -72% and off the right at 172%. */
      @keyframes bar-sweep {
        from { background-position: -75% 0; }
        to { background-position: 175% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        /* The sweep would otherwise stop off-screen and leave an empty track that says nothing. */
        .setup-bar-pulsing::after { background-size: 100% 100%; background-position: 0 0; opacity: 0.45; }
      }

      .setup-status { display: flex; align-items: flex-end; justify-content: space-between; margin-top: var(--space-5); gap: var(--space-3); }
      .setup.is-compact .setup-status { justify-content: center; }
      .setup-headline {
        font-size: var(--text-lg); line-height: var(--leading-tight); color: var(--text);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight);
      }
      .setup.is-compact .setup-headline {
        font-size: var(--text-sm); font-weight: var(--weight-regular);
        color: var(--muted); letter-spacing: var(--tracking-normal);
      }
      .setup.is-held .setup-headline { font-size: var(--text-2xl); }
      .setup-metrics {
        display: flex; align-items: baseline; gap: var(--space-3);
        font-variant-numeric: tabular-nums; flex: none;
      }
      .setup-elapsed {
        font-family: var(--font-mono); font-size: var(--text-xs); line-height: var(--leading-snug);
        color: var(--faint);
      }
      .setup-percent {
        font-size: var(--text-2xl); line-height: var(--leading-none); color: var(--text);
        letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums;
      }
      .setup-note {
        margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--muted);
        line-height: var(--leading-relaxed);
      }
      .setup.is-compact .setup-note { max-width: 22em; }
      .setup-next {
        margin: var(--space-1) 0 0; font-size: var(--text-xs); color: var(--faint);
        line-height: var(--leading-snug);
      }

      /* The steps, as a line with a pip per step: ink once done, mint while it is the one being
         waited on, hollow until then. */
      .setup-track {
        position: relative;
        list-style: none; margin: var(--space-7) 0 0; padding: 0;
        display: flex; flex-direction: column;
      }
      .setup-track::before {
        content: "";
        position: absolute; left: 3.5px; top: 14px; bottom: 14px; width: 1px;
        background: var(--hairline-strong);
      }
      .setup-track-item {
        position: relative;
        display: flex; align-items: center; gap: var(--space-3-5);
        padding: var(--space-1-5) 0;
        font-size: var(--text-sm); line-height: var(--leading-snug);
        color: var(--faint);
      }
      .setup-track-item.is-done { color: var(--text-dim); }
      .setup-track-item.is-now { color: var(--text); font-weight: var(--weight-semibold); }
      .setup-track-item.is-fail { color: var(--danger); font-weight: var(--weight-semibold); }
      .setup-track-item.is-warn { color: var(--warn); }
      .setup-track-pip {
        position: relative;
        width: 8px; height: 8px; flex: none; border-radius: var(--radius-full);
        /* Filled with the page so the line does not show through a step not yet reached. */
        background: var(--bg);
        box-shadow: inset 0 0 0 1.5px var(--border);
      }
      .setup-track-item.is-done .setup-track-pip { background: var(--text); box-shadow: none; }
      .setup-track-item.is-now .setup-track-pip {
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-glow);
        animation: pip-pulse 1.6s var(--ease-in-out) infinite;
      }
      .setup-track-item.is-fail .setup-track-pip { background: var(--danger); box-shadow: none; }
      .setup-track-item.is-warn .setup-track-pip { background: var(--warn); box-shadow: none; }
      @keyframes pip-pulse {
        0%, 100% { box-shadow: 0 0 0 2px var(--accent-glow); }
        50% { box-shadow: 0 0 0 6px var(--accent-glow); }
      }

      .setup-fail {
        margin-top: var(--space-5);
        padding: var(--space-4);
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius);
      }
      .setup-fail-title {
        margin: 0; font-size: var(--text-lg); font-weight: var(--weight-semibold);
        color: var(--danger); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
      }
      .setup-fail-step {
        margin: var(--space-2) 0 0; font-size: var(--text-sm); font-weight: var(--weight-semibold);
        color: var(--text); line-height: var(--leading-snug);
      }
      .setup-fail-detail {
        margin: var(--space-1) 0 0; font-size: var(--text-sm); color: var(--danger-fg);
        line-height: var(--leading-relaxed);
      }
      .setup-fail-hint {
        margin: var(--space-3) 0 0; font-size: var(--text-xs); color: var(--text-dim);
        line-height: var(--leading-relaxed);
      }

      .setup-actions { display: flex; gap: var(--space-2-5); margin-top: var(--space-5); flex-wrap: wrap; }
      .setup.is-compact .setup-actions { justify-content: center; }
      .setup-primary {
        font: inherit; font-size: var(--text-sm); font-weight: var(--weight-semibold);
        padding: var(--space-2-5) var(--space-5); cursor: pointer;
        background: var(--accent-fill); color: var(--accent-strong); border: 1px solid var(--accent-border);
        border-radius: var(--radius);
        transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), transform var(--ease);
      }
      .setup-primary:hover:not(:disabled) {
        background: var(--accent-fill-hover);
        box-shadow: 0 6px 22px var(--accent-glow);
        transform: translateY(-1px);
      }
      .setup-primary:active:not(:disabled) { transform: none; box-shadow: none; }
      .setup-primary:active:not(:disabled) { background: var(--accent-fill-active); }
      .setup-primary:disabled { opacity: 0.5; cursor: default; }
      .setup-secondary {
        font: inherit; font-size: var(--text-sm); padding: var(--space-2-5) var(--space-4); cursor: pointer;
        background: transparent; color: var(--muted); border: 1px solid var(--border);
        border-radius: var(--radius); transition: color var(--ease), border-color var(--ease), background var(--ease);
      }
      .setup-secondary:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); background: var(--hover-overlay); }
      .setup-secondary:disabled { opacity: 0.5; cursor: default; }

      .setup-details-toggle {
        margin-top: var(--space-5); background: none; border: none; color: var(--faint);
        font: inherit; font-size: var(--text-xs); cursor: pointer; padding: 0;
        display: inline-flex; align-items: center; gap: var(--space-1-5); align-self: flex-start;
      }
      .setup.is-compact .setup-details-toggle { align-self: center; margin-top: var(--space-6); }
      .setup-details-toggle::after {
        content: "";
        width: 5px; height: 5px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg) translateY(-1px);
        transition: transform var(--ease);
      }
      .setup-details-toggle[aria-expanded="true"]::after { transform: rotate(-135deg) translateY(-1px); }
      .setup-details-toggle:hover { color: var(--muted); }
      .setup-details { margin-top: var(--space-3-5); width: 100%; text-align: left; }

      .steps { list-style: none; margin: 0 0 var(--space-3-5); padding: 0; }
      .step {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: var(--space-0-5) var(--space-2-5);
        padding: var(--space-2) 0; border-bottom: 1px solid var(--border-subtle);
      }
      .step:last-of-type { border-bottom: none; }
      .step .icon {
        width: 22px; height: 22px; flex: none; grid-row: 1 / span 2;
        display: grid; place-items: center;
        border-radius: var(--radius-full); font-size: var(--text-2xs);
        background: var(--raised); color: var(--muted);
      }
      .step-pass .icon { background: var(--ok-bg); color: var(--ok); }
      .step-fail .icon { background: var(--danger-bg); color: var(--danger); }
      .step-warn .icon { background: var(--warn-bg); color: var(--warn); }
      .step-running .icon { background: var(--accent-fill); color: var(--accent-strong); }
      .step .label { font-size: var(--text-sm); line-height: var(--leading-snug); color: var(--text-dim); }
      .step .detail { color: var(--faint); font-size: var(--text-xs); line-height: var(--leading-snug); }
      .step-fail .label { color: var(--danger); }
      .step-warn .label { color: var(--warn); }

      pre.log {
        background: var(--bg-deep);
        color: var(--log-fg);
        padding: var(--space-3) var(--space-3-5);
        min-height: 160px;
        max-height: 240px;
        overflow-y: auto;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-subtle);
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        line-height: var(--leading-normal);
        white-space: pre-wrap;
      }

      /* ── Shell chrome ────────────────────────────────────────────────────────────────────────
         Γ frame: titlebar is the app, bezel is the guest's edge. Nothing floats over .viewport
         — a native child window will later paint there. */
      .app {
        width: 100%; height: 100%;
        display: flex; flex-direction: row;
        min-width: 0; min-height: 0;
        background: var(--bg);
      }
      .workspace {
        flex: 1; display: flex; flex-direction: column;
        min-width: 0; min-height: 0;
      }

      .shell-head {
        flex: none;
        display: flex; flex-direction: column;
        background: var(--chrome);
        min-width: 0;
      }
      .titlebar {
        display: flex; align-items: center; gap: var(--space-3);
        height: var(--titlebar-height); min-height: var(--titlebar-height);
        padding: 0 var(--space-3);
        background: var(--chrome);
        border-bottom: 1px solid var(--border);
        flex: none; min-width: 0;
      }
      .shell-head:has(.device-menu) .titlebar { border-bottom-color: var(--border-subtle); }
      .titlebar-brand {
        display: flex; align-items: center; gap: var(--space-2-5);
        font-size: var(--text-sm); font-weight: var(--weight-semibold);
        letter-spacing: var(--tracking-tight); color: var(--text); line-height: var(--leading-none);
        flex: none;
      }
      .titlebar-word { white-space: nowrap; }
      .titlebar-spacer { flex: 1; min-width: var(--space-3); }

      .nav-rail {
        display: flex; flex-direction: row; align-items: center;
        gap: var(--space-2);
        width: auto; flex: none;
        padding: 0;
        background: none;
        border: none;
      }
      .nav-track {
        display: flex; align-items: stretch;
        background: var(--nav-track);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius);
        padding: 2px;
        gap: 2px;
      }
      .nav-rail-item {
        position: relative;
        display: flex; flex-direction: row; align-items: center; justify-content: center;
        gap: var(--space-1-5);
        padding: var(--space-1) var(--space-2-5);
        background: none; border: none; color: var(--faint);
        border-radius: var(--radius-sm); cursor: pointer;
        font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold);
        line-height: var(--leading-none);
        white-space: nowrap;
        transition: color var(--ease), background var(--ease);
      }
      .nav-rail-item:hover { color: var(--text); background: var(--hover-overlay); }
      .nav-track .nav-rail-item.on { color: var(--text); background: var(--surface); }
      .nav-rail-item:focus-visible { box-shadow: var(--focus); }
      .nav-rail-item.is-utility {
        width: 32px; height: 32px; padding: 0;
        position: relative;
      }
      .nav-rail-item.is-utility.on { color: var(--accent); background: var(--accent-soft); }
      .nav-rail-item.is-utility .nav-rail-label {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      /* Something is waiting behind this item: an update, today. */
      .nav-rail-dot {
        position: absolute; top: 3px; right: 3px;
        width: 7px; height: 7px; border-radius: var(--radius-full);
        background: var(--accent); box-shadow: 0 0 0 2px var(--chrome);
      }

      .tool-rail {
        width: var(--bezel-width); flex: none; align-self: stretch;
        display: flex; flex-direction: column; align-items: center; gap: var(--space-1);
        padding: var(--space-2) var(--space-1);
        background: var(--chrome);
        border-left: 1px solid var(--border);
      }
      .tool-rail.is-hidden { display: none; }
      .tool-rail-group { display: flex; flex-direction: column; align-items: center; gap: var(--space-0-5); }
      .tool-rail-rule {
        width: 20px; height: 1px; flex: none;
        background: var(--border-subtle);
        margin: var(--space-1) 0;
      }
      .tool-rail-spacer { flex: 1; }
      .tool-btn {
        width: var(--bezel-btn-size); height: var(--bezel-btn-size); flex: none;
        display: grid; place-items: center;
        background: none; border: none; color: var(--muted);
        border-radius: var(--radius); cursor: pointer;
        transition: color var(--ease), background var(--ease);
      }
      .tool-btn:hover:not(:disabled) { color: var(--text); background: var(--hover-overlay); }
      .tool-btn:active:not(:disabled) { background: var(--surface-active); }
      .tool-btn:disabled { opacity: 0.35; cursor: default; }
      .tool-btn:focus-visible { box-shadow: var(--focus); }
      .tool-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }

      .app-theater .shell-head { display: none; }
      .app-theater .tool-rail { background: var(--bg-deep); }

      /* ── Device cluster ──────────────────────────────────────────────────────────────────────
         Start/stop/prepare and the Android version picker, in the titlebar.
         The version menu expands in-flow below the bar so it never covers the viewport. */
      .device-cluster {
        display: flex; align-items: center; gap: var(--space-2);
        flex: none; min-width: 0;
        font-size: var(--text-2xs);
        line-height: var(--leading-snug);
      }
      .device-dot { width: var(--space-2); height: var(--space-2); border-radius: var(--radius-full); flex: none; background: var(--idle); box-shadow: 0 0 0 3px var(--idle-ring); }
      .device-dot-on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-ring); }
      .device-dot-boot, .device-dot-starting, .device-dot-stopping {
        background: var(--warn); box-shadow: 0 0 0 3px var(--warn-ring);
        animation: install-pulse var(--duration-pulse) var(--ease-in-out) infinite;
      }
      .device-dot-stopped { background: var(--idle); box-shadow: 0 0 0 3px var(--idle-ring); }
      .device-phase { color: var(--muted); font-weight: var(--weight-semibold); white-space: nowrap; }
      .device-meta { color: var(--faint); white-space: nowrap; }
      .device-error { color: var(--warn); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .device-btn {
        display: inline-flex; align-items: center; gap: var(--space-1);
        font: inherit; font-size: var(--text-2xs); font-weight: var(--weight-semibold);
        padding: var(--space-1) var(--space-2-5); cursor: pointer;
        background: var(--raised); color: var(--text-dim); border: 1px solid var(--border);
        border-radius: var(--radius-sm); transition: background var(--ease), border-color var(--ease), color var(--ease);
        white-space: nowrap;
      }
      .device-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
      .device-btn:active:not(:disabled) { background: var(--surface-active); }
      .device-btn:disabled { opacity: 0.45; cursor: default; }
      .device-btn-primary { background: var(--accent-fill); color: var(--accent-strong); border-color: var(--accent-border); }
      .device-btn-primary:hover:not(:disabled) { background: var(--accent-fill-hover); color: var(--accent-strong); }
      .device-btn-stop { color: var(--danger-fg); border-color: var(--danger-border); background: var(--danger-bg); }
      .device-btn-stop:hover:not(:disabled) { background: var(--danger-bg-hover); color: var(--danger); }

      .device-profile { position: relative; flex: none; }
      .device-profile .device-btn .oe-icon { transition: transform var(--ease); }
      .device-profile .device-btn[aria-expanded="true"] .oe-icon { transform: rotate(180deg); }
      .device-menu {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-1);
        padding: var(--space-3) var(--space-3-5) var(--space-2);
        background: var(--raised);
        border-bottom: 1px solid var(--border);
        animation: panel-in var(--duration-fast) var(--ease-emphasized);
      }
      .device-menu-head {
        grid-column: 1 / -1;
        margin: 0 0 var(--space-1); font-size: var(--text-2xs); letter-spacing: var(--tracking-wider);
        text-transform: uppercase; color: var(--faint); font-weight: var(--weight-semibold); line-height: var(--leading-snug);
      }
      .device-menu-item {
        display: flex; flex-direction: column; gap: var(--space-1); width: 100%; min-width: 0; text-align: left;
        background: none; border: none; color: inherit; font: inherit; cursor: pointer;
        padding: var(--space-2-5); border-radius: var(--radius-sm);
        transition: background var(--ease);
      }
      .device-menu-item:hover { background: var(--surface-hover); }
      .device-menu-item.on { background: var(--accent-soft); }
      .device-menu-item.on:focus-visible { box-shadow: var(--focus); }
      .device-menu-item.on .device-menu-label { color: var(--accent); }
      .device-menu-label { font-size: var(--text-sm); color: var(--text); display: flex; gap: var(--space-2); align-items: center; font-weight: var(--weight-semibold); }
      .device-menu-check { color: var(--accent); display: inline-flex; }
      .device-menu-desc { font-size: var(--text-xs); color: var(--muted); line-height: var(--leading-snug); }
      /* Flags a guest image that carries Google Mobile Services — it cannot be redistributed. */
      .device-menu-flag { font-size: var(--text-2xs); color: var(--warn); line-height: var(--leading-snug); }
      .device-menu-foot { grid-column: 1 / -1; margin: var(--space-1) 0 0; font-size: var(--text-2xs); color: var(--faint); line-height: var(--leading-normal); }

      @media (max-width: 860px) {
        .titlebar-word { display: none; }
        .nav-rail-label {
          position: absolute; width: 1px; height: 1px;
          padding: 0; margin: -1px; overflow: hidden;
          clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        .nav-rail-item { position: relative; padding: var(--space-1) var(--space-2); }
        .device-phase, .device-meta, .device-error { display: none; }
        .account-caption { display: none; }
        .account-chip { padding-right: var(--space-1); }
      }
      @media (max-width: 640px) {
        .device-menu { grid-template-columns: 1fr; }
      }

      .play-setup-actions { display: flex; gap: var(--space-2-5); margin: var(--space-5) 0; }

      .stage { flex: 1; display: flex; min-width: 0; min-height: 0; position: relative; }

      .account {
        flex: 1; min-width: 0; min-height: 0;
        overflow-y: auto;
        padding: var(--space-6) var(--space-7);
        background: var(--bg);
        animation: panel-in var(--duration-normal) var(--ease-emphasized);
      }
      .account-sheet { max-width: 34rem; }

      .android-screen {
        flex: 1; min-width: 0; min-height: 0;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 85% 60% at 50% -18%, var(--wash-top), var(--wash-edge) 62%),
          radial-gradient(ellipse 60% 50% at 50% 50%, var(--screen-spot) 0%, var(--bg-deep) 72%);
        padding: var(--space-4);
      }
      .viewport {
        flex: 1; min-width: 0; min-height: 0;
        display: flex;
      }
      /* touch-action/user-select keep pointer capture usable for drag-to-swipe — without them the
         browser claims the gesture as a text or image drag. max-height: 100% (not 100vh) so the
         image fits the stage under the chrome instead of overflowing it. */
      .android-screen img {
        max-width: 100%; max-height: 100%; width: auto; height: auto;
        object-fit: contain;
        cursor: pointer; touch-action: none; user-select: none;
        border-radius: var(--radius-xs);
        box-shadow: var(--shadow-lg);
      }
      .app-theater .android-screen { padding: 0; }
      .app-theater .android-screen img { border-radius: 0; box-shadow: none; }
      .android-screen .waiting,
      .play-surface .waiting,
      .waiting {
        color: var(--muted);
        display: flex; flex-direction: column; align-items: center; gap: var(--space-3-5);
        text-align: center; font-size: var(--text-sm); line-height: var(--leading-normal);
      }
      /* The device, drawn: a body whose edge runs from a lit top to nothing, an ink screen in both
         themes, and — only while Android is on its way — a mint line reading down the glass. */
      .waiting-mark {
        position: relative; flex: none;
        width: 64px; height: 114px;
        border: 1.5px solid transparent;
        border-radius: 17px;
        background:
          linear-gradient(180deg, var(--device-body-top), var(--device-body-bottom)) padding-box,
          linear-gradient(180deg, var(--hairline-strong), var(--hairline)) border-box;
        box-shadow: var(--shadow-lg);
      }
      /* The earpiece. */
      .waiting-mark::before {
        content: "";
        position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
        width: 16px; height: 3px; border-radius: var(--radius-full);
        background: var(--hairline-strong);
      }
      /* The pool of light it stands in, there only while it is live. */
      .waiting-mark::after {
        content: "";
        position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%);
        width: 120px; height: 18px; border-radius: 50%;
        background: radial-gradient(closest-side, var(--accent-glow), transparent);
        opacity: 0;
        transition: opacity var(--duration-slow) var(--ease-standard);
      }
      .waiting-mark-live {
        background:
          linear-gradient(180deg, var(--device-body-top), var(--device-body-bottom)) padding-box,
          linear-gradient(180deg, var(--accent-border), var(--hairline)) border-box;
      }
      .waiting-mark-live::after { opacity: 1; }
      .waiting-screen {
        position: absolute; top: 14px; left: 4px; right: 4px; bottom: 6px;
        border-radius: 10px; overflow: hidden;
        background: linear-gradient(180deg, #141416 0%, #050506 60%);
      }
      /* Off: one standing light. */
      .waiting-screen::after {
        content: "";
        position: absolute; left: 50%; top: 50%;
        width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
        border-radius: var(--radius-full);
        background: var(--mint);
        box-shadow: 0 0 10px rgba(143, 242, 204, 0.55);
        opacity: 0.85;
      }
      .device-idle-checking .waiting-screen::after,
      .device-idle-stopping .waiting-screen::after { animation: dot-breathe 1.4s var(--ease-in-out) infinite; }
      .device-idle-error .waiting-screen::after { background: var(--danger); box-shadow: none; }
      /* On its way: the light becomes a line that reads down the glass. */
      .waiting-mark-live .waiting-screen::after { display: none; }
      .waiting-mark-live .waiting-screen::before {
        content: "";
        position: absolute; left: 0; right: 0; top: -40%; height: 38%;
        background: linear-gradient(180deg, transparent, rgba(143, 242, 204, 0.16) 72%, var(--mint) 100%);
        animation: screen-scan 2.2s var(--ease-in-out) infinite;
      }
      /* 370% of its own height is 140% of the screen: from above the glass to below it. */
      @keyframes screen-scan {
        from { transform: translateY(0); }
        to { transform: translateY(370%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .waiting-mark-live .waiting-screen::before { top: 31%; }
      }

      .device-idle {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: var(--space-3); max-width: 400px; padding: var(--space-4);
        animation: panel-in var(--duration-slow) var(--ease-emphasized);
      }
      .device-idle-title {
        margin: var(--space-6) 0 0; font-size: var(--text-2xl); font-weight: var(--weight-semibold);
        letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
        color: var(--text);
        background: linear-gradient(180deg, var(--text) 30%, var(--muted) 130%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .device-idle-copy {
        margin: 0; font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed);
      }
      .device-idle-elapsed {
        margin: 0; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .device-idle-error-text {
        margin: 0; font-size: var(--text-xs); color: var(--danger); line-height: var(--leading-normal);
        max-width: 32em;
      }
      .device-idle-bar { width: 200px; margin-top: var(--space-1); }
      .device-idle .setup-primary { margin-top: var(--space-3); }

      /* Where the wait is: three words, and a pip for each. */
      .boot-stages {
        list-style: none; margin: var(--space-2) 0 var(--space-1); padding: 0;
        display: flex; align-items: center; gap: var(--space-2);
        font-size: var(--text-2xs); font-weight: var(--weight-semibold);
        letter-spacing: var(--tracking-wider); text-transform: uppercase;
        color: var(--faint); line-height: var(--leading-none);
      }
      .boot-stage { display: flex; align-items: center; gap: var(--space-1-5); }
      .boot-stage + .boot-stage::before {
        content: "";
        width: 22px; height: 1px; margin-right: var(--space-0-5);
        background: var(--hairline-strong);
      }
      .boot-stage-pip {
        width: 6px; height: 6px; flex: none; border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1.5px var(--border);
      }
      .boot-stage.is-done { color: var(--text-dim); }
      .boot-stage.is-done .boot-stage-pip { background: var(--text); box-shadow: none; }
      .boot-stage.is-now { color: var(--text); }
      .boot-stage.is-now .boot-stage-pip {
        background: var(--accent);
        animation: pip-pulse 1.6s var(--ease-in-out) infinite;
      }

      /* ── Skeletons ───────────────────────────────────────────────────────────────────────────
         A list that is on its way is shown as the shape of the list, with one slow band of
         light crossing it — not as a spinner in an empty room. */
      .skeleton {
        display: block; border-radius: var(--radius-sm);
        background: linear-gradient(100deg, var(--skeleton-from) 30%, var(--skeleton-to) 50%, var(--skeleton-from) 70%);
        background-size: 220% 100%;
        animation: skeleton-sweep 1.7s var(--ease-linear) infinite;
      }
      @keyframes skeleton-sweep {
        from { background-position: 120% 0; }
        to { background-position: -120% 0; }
      }
      .skeleton-icon { width: var(--space-12); height: var(--space-12); border-radius: var(--space-3); }
      .skeleton-line { width: 72%; height: 10px; }
      .skeleton-line-short { width: 46%; height: 8px; }
      .skeleton-line-wide { width: 100%; }
      .skeleton-title { width: 9rem; height: 18px; }
      .skeleton-block { width: 100%; height: 64px; border-radius: var(--radius-md); }
      /* Quieter than a real tile: it is a promise of one, and should not draw the eye first. */
      .app-tile-skeleton, .store-card-skeleton { border-color: var(--border-subtle); box-shadow: none; }
      .app-tile-skeleton { cursor: default; pointer-events: none; }
      .app-tile-skeleton:hover { transform: none; }
      /* Each tile's band starts a little after the one before, so the light crosses the grid
         rather than every tile blinking together. */
      .app-tile-skeleton:nth-child(4n + 2) .skeleton { animation-delay: 0.12s; }
      .app-tile-skeleton:nth-child(4n + 3) .skeleton { animation-delay: 0.24s; }
      .app-tile-skeleton:nth-child(4n + 4) .skeleton { animation-delay: 0.36s; }
      .skeleton-stack { display: flex; flex-direction: column; gap: var(--space-3); }
      .skeleton-text { display: flex; flex-direction: column; gap: var(--space-2); max-width: 36rem; }
      .store-card.store-card-skeleton {
        flex-direction: row; align-items: center; gap: var(--space-3-5);
        padding: var(--space-4); pointer-events: none;
      }
      .store-card-skeleton-text { flex: 1; display: flex; flex-direction: column; gap: var(--space-2); }
      .store-card-skeleton:nth-child(3n + 2) .skeleton { animation-delay: 0.14s; }
      .store-card-skeleton:nth-child(3n + 3) .skeleton { animation-delay: 0.28s; }

      .library {
        flex: 1; min-width: 0; overflow-y: auto; padding: var(--space-6) var(--space-7);
        animation: panel-in var(--duration-normal) var(--ease-emphasized);
      }
      .library-head { margin: 0 0 var(--space-5); }
      .library h2 {
        margin: 0; font-size: var(--text-xl); font-weight: var(--weight-semibold);
        color: var(--text); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
      }
      .library-sub { margin: var(--space-1) 0 0; font-size: var(--text-sm); line-height: var(--leading-snug); color: var(--faint); }

      .empty-state {
        display: flex; flex-direction: column; align-items: flex-start;
        gap: var(--space-1-5); max-width: 420px;
        padding: var(--space-7) 0 var(--space-2);
      }
      .empty-state-center { align-items: center; text-align: center; margin: var(--space-12) auto 0; }
      .empty-title { margin: 0; font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--text); line-height: var(--leading-tight); }
      .empty-copy { margin: 0; font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed); max-width: 36em; }
      .empty-state .library-empty, .empty-state .store-note { margin: 0; }
      .empty-panel {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: var(--space-3); max-width: 400px;
        margin: var(--space-12) auto 0; padding: var(--space-4);
      }
      .empty-panel-icon {
        width: 56px; height: 56px; display: grid; place-items: center;
        border-radius: var(--radius-lg); background: var(--icon-well); color: var(--accent);
        box-shadow: var(--shadow-inset);
      }
      .empty-panel .setup-primary { margin-top: var(--space-2); }
      .store-body > .empty-panel { margin-top: var(--space-8); }

      .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: var(--space-3); align-items: stretch; }
      .app-tile {
        display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
        padding: var(--space-5) var(--space-3) var(--space-4);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: inherit; font: inherit; cursor: pointer; text-align: center;
        transition: background var(--ease), border-color var(--ease), transform var(--ease);
        box-shadow: var(--shadow-inset);
      }
      .app-tile:hover { background: var(--surface-hover); border-color: var(--border-strong); transform: translateY(-1px); }
      .app-tile:active { transform: translateY(0); }
      .app-tile:disabled { opacity: 0.5; cursor: default; transform: none; }
      .app-icon-wrap { display: grid; place-items: center; }
      .app-mark {
        display: grid; place-items: center; position: relative; flex: none;
        border-radius: var(--space-3); background: var(--icon-well); color: var(--accent);
        font-size: var(--text-sm); font-weight: var(--weight-semibold);
        letter-spacing: var(--tracking-tight); line-height: var(--leading-none);
        box-shadow: var(--shadow-inset); overflow: hidden; text-transform: uppercase;
      }
      .app-mark::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(165deg, var(--accent-soft), transparent 62%);
      }
      .app-mark-letter { position: relative; }
      .app-mark-1 { border-radius: var(--radius-full); }
      .app-mark-2 {
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-inset), inset 0 0 0 2px var(--accent-border);
      }
      .app-mark-3 { border-radius: var(--radius); }
      .app-mark-lg { font-size: var(--text-xl); }
      .app-mark-busy { width: var(--space-12); height: var(--space-12); }
      .app-icon {
        width: var(--space-12); height: var(--space-12); display: grid; place-items: center;
        border-radius: var(--space-3); background: var(--icon-well); color: var(--accent);
        font-size: var(--text-2xl); font-weight: var(--weight-semibold);
        box-shadow: var(--shadow-inset);
      }
      .app-label { font-size: var(--text-sm); color: var(--text); font-weight: var(--weight-semibold); line-height: var(--leading-snug); }
      .app-package { font-size: var(--text-2xs); color: var(--faint); word-break: break-all; line-height: var(--leading-snug); }

      /* ── Store ───────────────────────────────────────────────────────────────────────────────
         Same palette and the same tile geometry as .app-tile above, so the Store and the Apps
         grid read as one surface rather than two apps bolted together. */
      .store {
        flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg);
        animation: panel-in var(--duration-normal) var(--ease-emphasized);
      }
      .store-dropping { outline: 2px dashed var(--accent-border); outline-offset: calc(var(--space-2) * -1); background: var(--accent-soft); }

      .store-bar {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-3) var(--space-5);
        border-bottom: 1px solid var(--border);
        background: var(--chrome);
      }
      .store-search-wrap { flex: 1; min-width: 0; position: relative; }
      .store-search, .play-search {
        flex: 1; min-width: 0; width: 100%;
        padding: var(--space-2) var(--space-3) var(--space-2) calc(var(--space-3) + var(--space-3) + var(--space-2-5)); font: inherit; font-size: var(--text-sm);
        background: var(--bg-deep); color: var(--text);
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        transition: border-color var(--ease), box-shadow var(--ease);
      }
      .play-search { padding-left: var(--space-3); }
      .store-search-wrap::before {
        content: "";
        position: absolute; left: var(--space-3); top: 50%; width: var(--space-3); height: var(--space-3);
        border: 1.5px solid var(--faint); border-radius: var(--radius-full);
        transform: translateY(-60%);
        pointer-events: none;
      }
      .store-search-wrap::after {
        content: "";
        position: absolute; left: calc(var(--space-3) + var(--space-2) + var(--space-0-5)); top: 58%; width: var(--space-1-5); height: 1.5px;
        background: var(--faint); border-radius: 1px;
        transform: rotate(45deg);
        pointer-events: none;
      }
      .store-search:focus, .play-search:focus {
        outline: none; border-color: var(--accent-border);
        box-shadow: var(--focus);
      }
      .store-search:focus-visible, .play-search:focus-visible { box-shadow: var(--focus); }
      .store-search:disabled { opacity: 0.5; }
      .store-search::-webkit-search-decoration { display: none; }
      .source-chips { display: flex; gap: var(--space-1-5); flex: none; }
      .chip {
        background: none; border: 1px solid var(--border); color: var(--muted);
        font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold);
        padding: var(--space-1-5) var(--space-3); border-radius: var(--radius-full); cursor: pointer;
        transition: color var(--ease), background var(--ease), border-color var(--ease);
      }
      .chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--hover-overlay); }
      .chip.on { background: var(--accent-fill); border-color: var(--accent-border); color: var(--accent-strong); }
      .chip.on:focus-visible { box-shadow: var(--focus); }
      /* Install from file: the quiet button, trimmed to the search field's height so the bar
         does not grow for it. */
      .store-bar .setup-secondary { flex: none; white-space: nowrap; padding: var(--space-2) var(--space-3-5); }

      .store-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-5) var(--space-5); }
      .store-body-play { overflow: hidden; display: flex; flex-direction: column; padding: var(--space-4) var(--space-4); }
      .store-note { color: var(--muted); font-size: var(--text-sm); margin: var(--space-1) var(--space-0-5) var(--space-4); line-height: var(--leading-relaxed); }
      .store-home {
        display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-5);
        margin: 0 0 var(--space-5); flex-wrap: wrap;
      }
      .store-home h2 {
        margin: 0; font-size: var(--text-xl); font-weight: var(--weight-semibold);
        color: var(--text); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
      }
      .store-home-copy { margin: var(--space-1) 0 0; font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed); max-width: 42em; }
      .store-home-hint { margin: 0; font-size: var(--text-xs); color: var(--faint); line-height: var(--leading-snug); }
      .store-section { margin: 0 0 var(--space-6); }
      .store-section-label {
        margin: 0 0 var(--space-3); font-size: var(--text-xs); color: var(--faint);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wider); text-transform: uppercase;
      }
      .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--space-3-5); align-items: stretch; }

      .store-card {
        display: flex; flex-direction: column; position: relative;
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden;
        transition: border-color var(--ease), background var(--ease), transform var(--ease);
        box-shadow: var(--shadow-inset);
      }
      .store-card:hover { border-color: var(--border-strong); background: var(--surface-hover); transform: translateY(-1px); }
      .store-card-open {
        display: flex; gap: var(--space-3); align-items: flex-start; text-align: left;
        background: none; border: none; color: inherit; font: inherit; cursor: pointer;
        padding: var(--space-3-5) var(--space-3-5) var(--space-2-5);
      }
      .store-card-open:focus-visible { box-shadow: var(--focus); outline: none; }
      .store-card-icon { width: var(--space-12); height: var(--space-12); flex: none; border-radius: var(--space-3); object-fit: cover; background: var(--bg); }
      .store-card-icon-fallback { display: grid; place-items: center; background: var(--icon-well); color: var(--accent); font-size: var(--text-2xl); font-weight: var(--weight-semibold); }
      .store-card-text { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
      .store-card-name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text); line-height: var(--leading-snug); }
      .store-card-summary {
        font-size: var(--text-xs); color: var(--muted); line-height: var(--leading-snug);
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .store-card-foot { margin-top: auto; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3-5) var(--space-3-5); }
      .store-card-meta { flex: 1; display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); font-size: var(--text-2xs); color: var(--faint); min-width: 0; }
      .store-card-source { text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--faint); font-weight: var(--weight-semibold); }
      .store-card-license { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12em; }
      .store-card-error, .store-card-note { margin: 0 var(--space-3-5) var(--space-3); font-size: var(--text-2xs); color: var(--muted); line-height: var(--leading-snug); }
      .store-card-error { color: var(--danger); }
      .store-card-flags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: 0 var(--space-3-5) var(--space-3-5); }
      .store-flag {
        font-size: var(--text-2xs); letter-spacing: var(--tracking-wide); font-weight: var(--weight-semibold);
        color: var(--warn); border: 1px solid var(--warn-border); border-radius: var(--radius-xs); padding: var(--space-0-5) var(--space-1-5);
        background: var(--warn-bg); text-transform: none;
      }
      .store-card-progress {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: block; height: 3px; background: var(--bg-deep);
      }
      .store-card-progress-fill {
        display: block; height: 100%; background: linear-gradient(90deg, var(--progress-from), var(--progress-to));
        transition: width var(--duration-instant) var(--ease-linear);
      }

      .store-install {
        flex: none; font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--accent); cursor: pointer;
        background: none; border: 1px solid var(--accent-border); border-radius: var(--radius-sm); padding: var(--space-1) var(--space-3-5);
        transition: background var(--ease), color var(--ease);
      }
      .store-install:hover:not(:disabled) { background: var(--accent-fill); color: var(--accent-strong); }
      .store-install:disabled { opacity: 0.45; cursor: default; }
      .store-install-large {
        padding: var(--space-2) var(--space-5); font-size: var(--text-sm);
        background: var(--accent-fill); color: var(--accent-strong);
      }
      .store-install-large:hover:not(:disabled) { background: var(--accent-fill-hover); color: var(--accent-strong); }
      .store-install-small { padding: var(--space-1) var(--space-2-5); }

      .store-detail { max-width: 760px; }
      .store-back {
        background: none; border: none; color: var(--accent); font: inherit; font-size: var(--text-xs);
        cursor: pointer; padding: 0 0 var(--space-4); font-weight: var(--weight-semibold);
        display: inline-flex; align-items: center; gap: var(--space-1);
      }
      .store-back:hover { color: var(--accent-hover); }
      .store-detail-head { display: flex; gap: var(--space-4); align-items: flex-start; }
      .store-detail-icon { width: 72px; height: 72px; flex: none; border-radius: var(--radius-xl); object-fit: cover; background: var(--bg); font-size: var(--text-3xl); }
      .store-detail-title { flex: 1; min-width: 0; }
      .store-detail-title h2 {
        margin: 0 0 var(--space-1-5); font-size: var(--text-3xl); color: var(--text);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
      }
      .store-detail-summary { margin: 0 0 var(--space-1-5); font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-normal); }
      .store-detail-package { margin: 0; font-size: var(--text-2xs); color: var(--faint); word-break: break-all; }
      .store-detail-blocked { margin: var(--space-3-5) 0 0; font-size: var(--text-xs); color: var(--warn); }
      .store-detail-error { margin: var(--space-3) 0 0; font-size: var(--text-xs); color: var(--danger); line-height: var(--leading-normal); }
      .store-compat {
        margin: var(--space-4) 0 0; padding: var(--space-2-5) var(--space-3-5);
        font-size: var(--text-xs); line-height: var(--leading-normal); color: var(--text-dim);
        background: var(--raised); border: 1px solid var(--border-subtle); border-radius: var(--radius);
      }
      .store-facts-strip {
        display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-6);
        list-style: none; margin: var(--space-5) 0 0; padding: var(--space-4) 0 0;
        border-top: 1px solid var(--border-subtle);
      }
      .store-facts-strip li { display: flex; flex-direction: column; gap: var(--space-0-5); min-width: 0; }
      .store-facts-k { font-size: var(--text-2xs); color: var(--faint); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); text-transform: uppercase; }
      .store-facts-v { font-size: var(--text-sm); color: var(--text); font-weight: var(--weight-semibold); }

      .store-shots { display: flex; gap: var(--space-2-5); overflow-x: auto; padding: var(--space-5) 0 var(--space-2); }
      .store-shot { height: 280px; border-radius: var(--radius); border: 1px solid var(--border); flex: none; }

      .store-facts { display: grid; grid-template-columns: 130px 1fr; gap: var(--space-2) var(--space-4); margin: var(--space-5) 0; font-size: var(--text-xs); }
      .store-facts dt { color: var(--faint); }
      .store-facts dd { margin: 0; color: var(--text-dim); }
      .store-facts-url { color: var(--accent); word-break: break-all; user-select: text; }
      .store-description-block { margin: var(--space-5) 0 0; }
      .store-description-block h3, .store-anti h3 {
        font-size: var(--text-xs); color: var(--text-dim); margin: 0 0 var(--space-2-5);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
      }
      .store-description { font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed); white-space: pre-wrap; margin: 0; }
      .store-anti { margin: var(--space-5) 0 0; }
      .store-anti ul { margin: 0; padding: 0 0 0 var(--space-4); color: var(--text-dim); font-size: var(--text-sm); line-height: var(--leading-relaxed); }

      .store-versions { margin-top: var(--space-7); }
      .store-versions h3 {
        font-size: var(--text-sm); color: var(--text-dim); margin: 0 0 var(--space-2-5);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wide); text-transform: uppercase;
      }
      .store-version-row {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-2-5) 0; border-top: 1px solid var(--border-subtle); font-size: var(--text-xs);
      }
      .store-version-row span:first-child { flex: 0 0 120px; color: var(--text); font-weight: var(--weight-semibold); }
      .store-version-meta { flex: 1; color: var(--faint); }

      .install-queue {
        border-top: 1px solid var(--border);
        background: var(--chrome);
        padding: var(--space-2) var(--space-5) var(--space-2-5);
        max-height: 220px; overflow-y: auto;
        animation: panel-in var(--duration-fast) var(--ease-emphasized);
      }
      .install-row { display: flex; flex-direction: column; gap: var(--space-1-5); padding: var(--space-2-5) 0; }
      .install-row + .install-row { border-top: 1px solid var(--border-subtle); }
      .install-row-head { display: flex; align-items: center; gap: var(--space-2); }
      .install-state-icon { display: inline-flex; color: var(--accent); flex: none; }
      .install-queued .install-state-icon { color: var(--faint); }
      .install-done .install-state-icon { color: var(--ok); }
      .install-failed .install-state-icon { color: var(--danger); }
      .install-label { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--weight-semibold); font-size: var(--text-xs); }
      .install-pipeline { display: flex; list-style: none; margin: 0; padding: 0; width: 100%; }
      .install-pipe-step { display: flex; align-items: center; flex: 1; min-width: 0; }
      .install-pipe-step:last-child { flex: none; }
      .install-pipe-dot {
        width: 7px; height: 7px; flex: none; border-radius: var(--radius-full);
        background: var(--border-subtle);
      }
      .install-pipe-line { flex: 1; height: 1px; background: var(--border-subtle); margin: 0 var(--space-1); }
      .install-pipe-step.is-done .install-pipe-dot,
      .install-pipe-step.is-on .install-pipe-dot { background: var(--accent); }
      .install-pipe-step.is-done .install-pipe-line { background: var(--accent); }
      .install-done .install-pipe-step.is-done .install-pipe-dot,
      .install-done .install-pipe-step.is-done .install-pipe-line { background: var(--ok); }
      .install-failed .install-pipe-step .install-pipe-dot,
      .install-failed .install-pipe-step .install-pipe-line { background: var(--danger-border); }
      .install-bar { height: var(--space-1-5); background: var(--bg-deep); border-radius: var(--radius-full); overflow: hidden; }
      .install-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--progress-from), var(--progress-to)); border-radius: var(--radius-full); transition: width var(--duration-instant) var(--ease-linear); }
      .install-fill-pulsing { animation: install-pulse var(--duration-pulse) var(--ease-in-out) infinite; }
      @keyframes install-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .install-meta { display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--text-2xs); }
      .install-status { color: var(--text-dim); font-weight: var(--weight-semibold); }
      .install-detail { color: var(--faint); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .install-failed .install-status, .install-failed .install-detail { color: var(--danger); }
      .install-failed .install-fill { background: var(--danger-fill); }
      .install-done .install-fill { background: var(--ok-fill); }
      .install-done .install-status { color: var(--ok); }
      .install-dismiss { background: none; border: none; color: var(--faint); cursor: pointer; font-size: var(--text-lg); line-height: var(--leading-none); padding: var(--space-0-5) var(--space-1); border-radius: var(--radius-xs); display: inline-flex; align-items: center; }
      .install-dismiss:hover { color: var(--text); background: var(--dismiss-hover); }

      .store-status {
        display: flex; align-items: center; gap: var(--space-4);
        padding: var(--space-2) var(--space-5);
        border-top: 1px solid var(--border);
        font-size: var(--text-2xs); color: var(--faint);
        background: var(--bg-deep);
      }
      .store-link {
        background: none; border: none; color: var(--accent);
        font: inherit; font-size: var(--text-2xs); font-weight: var(--weight-semibold);
        cursor: pointer; padding: 0; margin-left: auto;
      }
      .store-link:hover { color: var(--accent-hover); }

      /* ── Play, rendered from the guest ────────────────────────────────────────────────────── */
      .play-frame { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .play-bar { display: flex; align-items: center; gap: var(--space-2); padding: 0 0 var(--space-3); }
      .play-nav {
        background: var(--raised); border: 1px solid var(--border-strong); color: var(--text-dim);
        font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold);
        padding: var(--space-1-5) var(--space-3); border-radius: var(--radius-sm); cursor: pointer;
        transition: background var(--ease);
      }
      .play-nav:hover { background: var(--surface-hover); color: var(--text); }
      .play-surface {
        flex: 1; min-height: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius-md);
        padding: var(--space-2);
      }
      .play-surface img { max-width: 100%; max-height: 100%; cursor: pointer; touch-action: none; user-select: none; border-radius: var(--radius-xs); }
      .play-surface .waiting { color: var(--muted); font-size: var(--text-sm); }
      .play-warning {
        margin: 0 0 var(--space-3); padding: var(--space-2-5) var(--space-3-5); font-size: var(--text-xs); line-height: var(--leading-normal);
        color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius);
      }

      /* Scrolls on its own: the pane around it has overflow hidden for the mirror's sake, and this
         panel is taller than a short window. */
      .play-setup { max-width: 560px; overflow-y: auto; margin: var(--space-3) auto 0; padding: var(--space-2) var(--space-1) var(--space-6); }
      .play-setup h2 {
        font-size: var(--text-2xl); margin: 0 0 var(--space-3); color: var(--text);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
      }
      .play-setup p { font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed); margin: 0 0 var(--space-3); }
      .play-setup code { background: var(--raised); padding: 1px var(--space-1-5); border-radius: var(--radius-xs); font-size: var(--text-xs); }
      .play-commands {
        background: var(--bg-deep); color: var(--accent); padding: var(--space-3) var(--space-3-5);
        border-radius: var(--radius-sm); font-size: var(--text-xs); line-height: var(--leading-relaxed); overflow-x: auto; user-select: text;
        font-family: var(--font-mono);
      }
      .play-note { color: var(--faint) !important; }

      /* ── Account ───────────────────────────────────────────────────────────────────────────
         A workspace page in the stage, never a overlay on the device. The viewport will later
         host a native child window; this surface replaces the device rather than covering it. */
      .account-chip {
        display: flex; align-items: center; gap: var(--space-2);
        align-self: center; flex: none;
        background: none; border: 1px solid var(--border);
        color: var(--muted); font: inherit; font-size: var(--text-xs);
        padding: var(--space-1) var(--space-3) var(--space-1) var(--space-1); border-radius: var(--radius-full); cursor: pointer;
        transition: color var(--ease), border-color var(--ease), background var(--ease);
      }
      .account-chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--hover-overlay); }
      .account-chip-on { border-color: var(--accent-border); color: var(--accent); background: var(--accent-soft); }
      .account-chip.is-open { color: var(--text); border-color: var(--border-strong); background: var(--hover-overlay); }
      .account-avatar {
        width: 22px; height: 22px; flex: none; display: grid; place-items: center;
        border-radius: var(--radius-full); background: var(--icon-well); color: var(--accent); font-size: var(--text-2xs); font-weight: var(--weight-semibold);
      }
      .account-chip-on .account-avatar { background: var(--accent-fill); color: var(--accent-strong); }
      .account-caption { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .account-head { margin: 0 0 var(--space-5); }
      .account-head h2 {
        margin: 0; font-size: var(--text-xl); font-weight: var(--weight-semibold);
        color: var(--text); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
      }
      .account-lead { margin: var(--space-1) 0 0; font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed); }

      .account-banner {
        display: flex; align-items: flex-start; gap: var(--space-3);
        padding: var(--space-3-5);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-inset);
      }
      .account-banner.is-ok { background: var(--ok-bg); border-color: var(--ok-fill); }
      .account-banner.is-out { background: var(--raised); }
      .account-banner.is-idle { background: var(--raised); }
      .account-banner-icon {
        width: 32px; height: 32px; flex: none; display: grid; place-items: center;
        border-radius: var(--radius-full); background: var(--icon-well); color: var(--accent);
      }
      .account-banner.is-ok .account-banner-icon { background: var(--ok-fill); color: var(--accent-strong); }
      .account-banner-title {
        margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semibold);
        color: var(--text); line-height: var(--leading-snug);
      }
      .account-banner-copy {
        margin: var(--space-0-5) 0 0; font-size: var(--text-xs); color: var(--muted);
        line-height: var(--leading-normal);
      }

      .account-section { margin-top: var(--space-7); }
      .account-section-label {
        margin: 0 0 var(--space-3); font-size: var(--text-xs); color: var(--faint);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wider); text-transform: uppercase;
      }
      .account-copy {
        margin: 0 0 var(--space-4); font-size: var(--text-sm); color: var(--muted);
        line-height: var(--leading-relaxed);
      }

      .account-field { display: block; margin: 0 0 var(--space-4); }
      .account-field-head {
        display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);
        margin-bottom: var(--space-1-5);
      }
      .account-field-label {
        display: block; font-size: var(--text-xs); color: var(--muted);
        font-weight: var(--weight-semibold); margin-bottom: var(--space-1-5);
      }
      .account-field-head .account-field-label { margin-bottom: 0; }
      .account-optional {
        font-size: var(--text-2xs); color: var(--faint); font-weight: var(--weight-semibold);
        letter-spacing: var(--tracking-wide); text-transform: uppercase;
      }
      .account-input {
        width: 100%; padding: var(--space-2-5) var(--space-3);
        font: inherit; font-size: var(--text-sm); line-height: var(--leading-snug);
        background: var(--bg-deep); color: var(--text);
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        transition: border-color var(--ease), box-shadow var(--ease);
      }
      .account-input:focus {
        outline: none; border-color: var(--accent-border);
        box-shadow: var(--focus);
      }
      .account-input:focus-visible { box-shadow: var(--focus); }
      .account-field-hint {
        display: block; margin: var(--space-1-5) 0 0; font-size: var(--text-xs);
        color: var(--faint); line-height: var(--leading-normal);
      }

      .account-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
      .account-actions .setup-primary { padding: var(--space-2) var(--space-4); }
      .account-btn {
        font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold);
        padding: var(--space-2) var(--space-3-5); cursor: pointer;
        background: var(--raised); color: var(--text-dim);
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        transition: background var(--ease), color var(--ease), border-color var(--ease);
      }
      .account-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); border-color: var(--border-strong); }
      .account-btn:disabled { opacity: 0.45; cursor: default; }

      .account-switch {
        display: flex; gap: var(--space-2-5); align-items: flex-start;
        margin: 0 0 var(--space-1); font-size: var(--text-sm); color: var(--text-dim);
        line-height: var(--leading-normal); cursor: pointer;
      }
      .account-switch input { margin-top: var(--space-0-5); flex: none; accent-color: var(--accent); }
      .account-switch-text { display: flex; flex-direction: column; gap: var(--space-0-5); }
      .account-switch-label { font-weight: var(--weight-semibold); color: var(--text); }
      .account-switch-hint { font-size: var(--text-xs); color: var(--faint); line-height: var(--leading-normal); }

      .account-vault {
        display: flex; align-items: flex-start; gap: var(--space-3);
        padding: var(--space-3-5);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-inset);
      }
      .account-vault-icon {
        width: 36px; height: 36px; flex: none; display: grid; place-items: center;
        border-radius: var(--radius); background: var(--icon-well); color: var(--accent);
      }
      .account-vault-title {
        margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semibold);
        color: var(--text); line-height: var(--leading-snug);
      }
      .account-vault-copy {
        margin: var(--space-1) 0 0; font-size: var(--text-xs); color: var(--muted);
        line-height: var(--leading-relaxed);
      }

      .account-status {
        margin: var(--space-3) 0 0; font-size: var(--text-xs); color: var(--accent);
        line-height: var(--leading-normal);
      }
      .account-foot {
        display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3);
        margin-top: var(--space-8); padding-top: var(--space-5);
        border-top: 1px solid var(--border-subtle);
      }
      .account-forget {
        background: none; border: none; padding: 0; cursor: pointer;
        font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold);
        color: var(--danger); line-height: var(--leading-snug);
      }
      .account-forget:hover:not(:disabled) { color: var(--danger-fg); }
      .account-forget:disabled { opacity: 0.45; cursor: default; }
      .account-foot .account-btn { margin-left: auto; }

      /* ── Settings ──────────────────────────────────────────────────────────────────────────
         A workspace page in the stage, never a overlay on the device. The viewport will later
         host a native child window; this surface replaces the device rather than covering it. */
      .settings {
        flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: var(--space-6) var(--space-7); background: var(--bg);
        animation: panel-in var(--duration-normal) var(--ease-emphasized);
      }
      .settings-sheet { max-width: 38rem; padding-bottom: var(--space-10); }

      .settings-head { margin: 0 0 var(--space-6); }
      .settings-head h2 {
        margin: 0; font-size: var(--text-xl); font-weight: var(--weight-semibold);
        color: var(--text); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight);
      }
      .settings-lead { margin: var(--space-1) 0 0; font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed); }

      .settings-banner {
        display: flex; align-items: flex-start; gap: var(--space-3);
        margin: 0 0 var(--space-6); padding: var(--space-3-5);
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-md); box-shadow: var(--shadow-inset);
      }
      .settings-banner.is-warn { background: var(--warn-bg); border-color: var(--warn-border); }
      .settings-banner-icon {
        width: 32px; height: 32px; flex: none; display: grid; place-items: center;
        border-radius: var(--radius-full); background: var(--icon-well); color: var(--accent);
      }
      .settings-banner.is-warn .settings-banner-icon { color: var(--warn); }
      .settings-banner-title {
        margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semibold);
        color: var(--text); line-height: var(--leading-snug);
      }
      .settings-banner.is-warn .settings-banner-title { color: var(--warn); }
      .settings-banner-copy { margin: var(--space-0-5) 0 0; font-size: var(--text-xs); color: var(--muted); line-height: var(--leading-normal); }

      .settings-block { margin: 0 0 var(--space-8); }
      .settings-label {
        margin: 0 0 var(--space-3); font-size: var(--text-xs); color: var(--faint);
        font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wider); text-transform: uppercase;
      }
      .settings-copy { margin: 0 0 var(--space-4); font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-relaxed); }
      .settings-hint { margin: var(--space-2) 0 0; font-size: var(--text-xs); color: var(--faint); line-height: var(--leading-normal); }
      .settings-hint.is-warn { color: var(--warn); }
      .settings-pending {
        margin: var(--space-3) 0 0; padding: var(--space-2-5) var(--space-3);
        font-size: var(--text-xs); color: var(--text-dim); line-height: var(--leading-normal);
        background: var(--raised); border: 1px solid var(--border-subtle); border-radius: var(--radius);
      }

      .settings-seg {
        display: flex; padding: var(--space-0-5); gap: var(--space-0-5);
        background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius);
      }
      .settings-seg-item {
        flex: 1; min-width: 0; padding: var(--space-2) var(--space-3);
        background: none; border: none; color: var(--muted); cursor: pointer;
        font: inherit; font-size: var(--text-sm); font-weight: var(--weight-semibold);
        border-radius: var(--radius-sm); line-height: var(--leading-none);
        transition: color var(--ease), background var(--ease);
      }
      .settings-seg-item:hover { color: var(--text); background: var(--hover-overlay); }
      .settings-seg-item.on { color: var(--text); background: var(--surface); box-shadow: var(--shadow-sm); }
      .settings-seg-item.on:focus-visible { box-shadow: var(--focus); }

      .settings-devices { display: flex; flex-direction: column; gap: var(--space-2); }
      .settings-device {
        display: flex; flex-direction: column; gap: var(--space-1); width: 100%; text-align: left;
        padding: var(--space-3) var(--space-3-5);
