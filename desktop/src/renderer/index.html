        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
        color: inherit; font: inherit; cursor: pointer;
        transition: background var(--ease), border-color var(--ease);
        box-shadow: var(--shadow-inset);
      }
      .settings-device:hover { background: var(--surface-hover); border-color: var(--border-strong); }
      .settings-device.on { background: var(--accent-soft); border-color: var(--accent-border); }
      .settings-device.on:focus-visible { box-shadow: var(--focus); }
      .settings-device-label {
        display: flex; align-items: center; gap: var(--space-2);
        font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text); line-height: var(--leading-snug);
      }
      .settings-device.on .settings-device-label { color: var(--accent); }
      .settings-device-check { color: var(--accent); display: inline-flex; margin-left: auto; }
      .settings-device-desc { font-size: var(--text-xs); color: var(--muted); line-height: var(--leading-snug); }

      .settings-facts {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--space-3) var(--space-5); margin: 0 0 var(--space-5);
      }
      .settings-facts dt {
        font-size: var(--text-2xs); color: var(--faint); font-weight: var(--weight-semibold);
        letter-spacing: var(--tracking-wide); text-transform: uppercase; margin: 0 0 var(--space-0-5);
      }
      .settings-facts dd { margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text); line-height: var(--leading-snug); }
      .settings-path { font-weight: var(--weight-regular); color: var(--text-dim); font-size: var(--text-xs); word-break: break-all; font-family: var(--font-mono); }

      .settings-field { margin: 0 0 var(--space-5); }
      .settings-field-label {
        margin: 0 0 var(--space-2); font-size: var(--text-xs); color: var(--muted);
        font-weight: var(--weight-semibold);
      }
      .settings-toggle-row {
        display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
      }
      .settings-toggle-row .settings-field-label { margin: 0; font-size: var(--text-sm); color: var(--text); }
      .settings-toggle-control { display: inline-flex; align-items: center; gap: var(--space-2); flex: none; }
      .settings-toggle-control .oe-icon { color: var(--muted); }
      .settings-toggle {
        position: relative; width: 40px; height: 22px; flex: none; padding: 0; font: inherit;
        background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius-full);
        cursor: pointer; transition: background var(--ease), border-color var(--ease);
      }
      .settings-toggle::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
        border-radius: var(--radius-full); background: var(--text-dim);
        box-shadow: var(--shadow-sm);
        transition: transform var(--ease), background var(--ease);
      }
      .settings-toggle:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-hover); }
      .settings-toggle.on { background: var(--accent-fill); border-color: var(--accent-border); }
      .settings-toggle.on::after { transform: translateX(18px); background: var(--accent-strong); }
      .settings-toggle.on:hover:not(:disabled) { background: var(--accent-fill-hover); border-color: var(--accent-border); }
      .settings-toggle.is-unknown { background: var(--bg-deep); border-color: var(--border-subtle); }
      .settings-toggle.is-unknown::after { transform: translateX(9px); background: var(--faint); box-shadow: none; }
      .settings-toggle:disabled { cursor: default; opacity: 0.55; }
      .settings-toggle:focus-visible { box-shadow: var(--focus); }
      /* ── A number, set by switch, slider or box ──────────────────────────────────────────────
         The track is the same hairline as every other bar in the app: ink to mint up to the
         thumb, a tick where Automatic would put it. */
      .settings-slider-field { margin: 0 0 var(--space-6); }
      .settings-slider-head {
        display: flex; align-items: baseline; gap: var(--space-3);
        margin: 0 0 var(--space-2-5);
      }
      .settings-slider-head .settings-field-label { margin: 0; font-size: var(--text-sm); color: var(--text); }
      .settings-slider-value {
        font-size: var(--text-sm); color: var(--muted); font-variant-numeric: tabular-nums;
      }
      .settings-auto {
        margin-left: auto; display: inline-flex; align-items: center; gap: var(--space-2);
        font-size: var(--text-xs); color: var(--muted); cursor: pointer; align-self: center;
      }
      .settings-slider-row { display: flex; align-items: flex-start; gap: var(--space-4); }
      .settings-slider-wrap { position: relative; flex: 1; min-width: 0; padding-top: var(--space-2); }
      .settings-slider {
        -webkit-appearance: none; appearance: none;
        display: block; width: 100%; height: 16px; margin: 0;
        background: transparent; cursor: pointer;
      }
      .settings-slider::-webkit-slider-runnable-track {
        height: 4px; border-radius: var(--radius-full);
        background:
          linear-gradient(90deg, var(--progress-from), var(--progress-to)) 0 0 / var(--fill, 0%) 100% no-repeat,
          var(--hairline-strong);
      }
      .settings-slider::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 16px; height: 16px; margin-top: -6px;
        border-radius: var(--radius-full);
        background: var(--text);
        border: 3px solid var(--bg);
        box-shadow: 0 0 0 1px var(--border-strong);
        transition: box-shadow var(--ease), transform var(--ease);
      }
      .settings-slider:hover:not(:disabled)::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--accent), 0 0 0 5px var(--accent-glow); }
      .settings-slider:active:not(:disabled)::-webkit-slider-thumb { transform: scale(1.12); }
      .settings-slider:focus-visible { box-shadow: none; }
      .settings-slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px var(--accent-glow); }
      /* On Automatic the control shows the value it would have, but is plainly not in the user's hands. */
      .settings-slider:disabled { cursor: default; }
      .settings-slider:disabled::-webkit-slider-runnable-track {
        background:
          linear-gradient(90deg, var(--faint), var(--faint)) 0 0 / var(--fill, 0%) 100% no-repeat,
          var(--hairline);
      }
      .settings-slider:disabled::-webkit-slider-thumb { background: var(--faint); box-shadow: none; }
      /* The thumb's centre travels from half its width to the track's width less half, so the tick does too. */
      .settings-slider-mark {
        position: absolute; top: calc(var(--space-2) + 12px);
        left: calc(8px + (100% - 16px) * var(--at, 0));
        width: 1px; height: 6px; margin-left: -0.5px;
        background: var(--border-strong); pointer-events: none;
      }
      .settings-slider-field.is-auto .settings-slider-mark { visibility: hidden; }
      .settings-slider-ends {
        display: flex; justify-content: space-between; margin-top: var(--space-2);
        font-size: var(--text-2xs); color: var(--faint); line-height: var(--leading-snug);
      }
      .settings-number {
        flex: none; display: inline-flex; align-items: center; gap: var(--space-1-5);
        height: 32px; padding: 0 var(--space-2-5);
        background: var(--bg-deep); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
        transition: border-color var(--ease), box-shadow var(--ease);
      }
      .settings-number:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
      .settings-number-input {
        width: 3.25em; padding: 0; border: none; background: none; outline: none;
        font-size: var(--text-sm); font-variant-numeric: tabular-nums; text-align: right; color: var(--text);
      }
      .settings-number-input:focus-visible { box-shadow: none; }
      .settings-number-input:disabled { color: var(--faint); }
      .settings-number-unit { font-size: var(--text-xs); color: var(--faint); }
      /* A note that closes a group of sliders needs room before whatever follows it. */
      .settings-slider-field + .settings-pending { margin-bottom: var(--space-6); }
      .settings-note {
        margin: 0 0 var(--space-5); font-size: var(--text-sm); color: var(--muted);
        line-height: var(--leading-relaxed); max-width: 36rem;
      }

      .settings-folder {
        margin: 0 0 var(--space-5);
        padding: var(--space-3-5);
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
        box-shadow: var(--shadow-inset);
      }
      .settings-folder-head {
        display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
        flex-wrap: wrap; margin: 0 0 var(--space-2);
      }
      .settings-folder-head .settings-field-label { margin: 0; }
      .settings-folder .settings-path { margin: 0; }
      .settings-folder .settings-hint { margin: var(--space-2) 0 0; }
      .settings-folder .setup-secondary {
        display: inline-flex; align-items: center; gap: var(--space-1-5); flex: none;
        padding: var(--space-1-5) var(--space-3);
        font-size: var(--text-xs); font-weight: var(--weight-semibold);
      }

      .settings-apply {
        margin: 0 0 var(--space-5); padding: var(--space-3);
        background: var(--raised); border: 1px solid var(--border-subtle); border-radius: var(--radius);
      }
      .settings-apply p {
        margin: 0; font-size: var(--text-xs); color: var(--text-dim); line-height: var(--leading-normal);
      }
      .settings-apply.is-warn { background: var(--warn-bg); border-color: var(--warn-border); }
      .settings-apply.is-warn p { color: var(--warn); }
      .settings-apply .setup-primary { margin-top: var(--space-3); }
      .settings-update-card { margin-bottom: 0; }
      .settings-update-bar { margin-top: var(--space-3); }
      .settings-update-action { margin-top: var(--space-3); }

      .settings-quiet {
        padding: var(--space-3-5);
        background: var(--raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
      }
      .settings-quiet-title {
        margin: 0 0 var(--space-1); font-size: var(--text-sm); font-weight: var(--weight-semibold);
        color: var(--text); line-height: var(--leading-snug);
      }
      .settings-quiet .settings-copy { margin: 0; }

      .settings-shortcuts {
        list-style: none; margin: var(--space-3) 0 0; padding: 0;
        display: flex; flex-direction: column; gap: var(--space-2);
      }
      .settings-shortcuts li {
        display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4);
        font-size: var(--text-sm); color: var(--muted);
      }
      kbd {
        font: inherit; font-family: var(--font-mono); font-size: var(--text-2xs); font-weight: var(--weight-semibold);
        padding: 0 var(--space-1); border: 1px solid var(--border); border-radius: var(--radius-xs);
        background: var(--raised); color: var(--text-dim);
      }

      .settings-engine { margin: var(--space-2) 0 0; font-size: var(--text-2xs); color: var(--faint); line-height: var(--leading-snug); }

    </style>
  </head>

    <div id="root"></div>
